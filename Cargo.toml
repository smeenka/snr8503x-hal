[package]
name = "snr8503x-hal"
version = "0.1.0"
edition = "2024"


[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
snr8503-pac = { path = "snr8503-pac", features = ["rt", "critical-section"] }
defmt     = {version ="1.1"}

[profile.release]
lto = true
opt-level = "z"

resolver = "2"
